# 密盒 VaultKey —— 版本号唯一来源
#
# 改版本只改这里，构建脚本与界面「关于应用」都会自动跟随。
#
# 规则：
#   VERSION_NAME  x.y.z   语义化版本
#   VERSION_CODE  整数     必须单调递增。Android 靠它判断新旧，
#                          比已安装版本小会被拒绝安装，所以只能涨不能退。
#
# 发版流程：
#   1. 改这里的 VERSION_NAME / VERSION_CODE（code 必须 +1）
#   2. bash build_manual.sh
#   3. 在「密盒-VaultKey-更新日志.md」追加本章节（新增了什么 / 修了什么）
#   4. git add -A && git commit -m "v3.0.0 ..." && git tag -a v3.0.0 -m "..."
#
# 已发布过的 code 不可复用（即使那个版本被放弃，编号也要跳过）。
#   13 = 2.9.0（卡包 OCR 增强）已废弃
#   14 = 2.10.0
#   15 = 3.0.0
VERSION_NAME=3.15.0
VERSION_CODE=57
