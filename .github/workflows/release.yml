name: 构建并发布 APK

on:
  push:
    tags:
      - 'v*.*.*'          # 推送 v3.13.0 这样的标签即触发
  workflow_dispatch:       # 也允许在网页上手动点一下

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 需要往 Release 里传文件

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android —— 它在 ubuntu-latest 上会失败。
      # 这里直接下载官方命令行工具，反而更稳、也更快。
      - name: 安装 Android 命令行工具
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -sSL -o cmd.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmd.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: 装 platform 34 与 build-tools 34
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed

      - name: 构建 APK
        run: |
          chmod +x build_manual.sh
          SIGN=0 ./build_manual.sh

      - name: 取出版本号
        id: ver
        run: |
          V=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d ' \r')
          echo "name=$V" >> $GITHUB_OUTPUT
          echo "版本号：$V"

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 密盒 v${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: VaultKey-v${{ steps.ver.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验产物
        run: |
          APK=$(ls VaultKey-v*.apk | head -1)
          aapt dump badging "$APK" | head -3
          ls -lh "$APK"
